name: digital-store

x-app-env: &app-env
  NODE_ENV: ${NODE_ENV:-development}
  MONGODB_URI: mongodb://mongodb:27017/digital_store?replicaSet=rs0
  REDIS_URL: redis://redis:6379
  BOT_TOKEN: ${BOT_TOKEN}
  BOT_API_SECRET: ${BOT_API_SECRET}
  ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:-}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
  JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
  JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  ENCRYPTION_KEY_VERSION: ${ENCRYPTION_KEY_VERSION:-1}
  ENCRYPTION_KEYS_JSON: ${ENCRYPTION_KEYS_JSON:-}
  PAYLOAD_HASH_KEY: ${PAYLOAD_HASH_KEY}
  PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET}
  WEB_APP_URL: ${WEB_APP_URL:-http://localhost:8080}
  API_URL: http://api:3001
  SHOP_NAME: ${SHOP_NAME:-Digital Store}
  DELIVERY_ATTEMPTS: ${DELIVERY_ATTEMPTS:-6}
  DELIVERY_BACKOFF_MS: ${DELIVERY_BACKOFF_MS:-5000}
  BOT_CONFIG_POLL_SECONDS: ${BOT_CONFIG_POLL_SECONDS:-15}

services:
  mongodb:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    restart: unless-stopped
    volumes: ["mongo-data:/data/db"]
    ports: ["27017:27017"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' localhost:27017/admin | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  mongo-init-replica:
    image: mongo:8.0
    depends_on:
      mongodb: { condition: service_healthy }
    restart: "no"
    entrypoint: ["bash", "/scripts/init-replica.sh"]
    volumes: ["./scripts/init-replica.sh:/scripts/init-replica.sh:ro"]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes: ["redis-data:/data"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: { context: ., dockerfile: Dockerfile.api }
    restart: unless-stopped
    environment: { <<: *app-env, PORT: 3001 }
    depends_on:
      mongo-init-replica: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    expose: ["3001"]

  telegram-bot:
    build: { context: ., dockerfile: Dockerfile.bot }
    restart: unless-stopped
    environment: { <<: *app-env, DELIVERY_CONCURRENCY: "${DELIVERY_CONCURRENCY:-5}" }
    depends_on:
      api: { condition: service_started }
      redis: { condition: service_healthy }

  admin-web:
    build: { context: ., dockerfile: Dockerfile.admin-web }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${WEB_APP_URL:-http://localhost:8080}/api
      MONGODB_URI: mongodb://mongodb:27017/digital_store?replicaSet=rs0
    depends_on: { api: { condition: service_started } }
    expose: ["3000"]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["8080:80"]
    volumes: ["./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [api, admin-web]

volumes:
  mongo-data:
  redis-data:
